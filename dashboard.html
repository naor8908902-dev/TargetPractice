<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Target Practice | Tactical Ops</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <style>
        /* וידוא שהעיצוב נשאר נאמן למקור במידה והקובץ החיצוני לא נטען */
        body { background-color: #000000; color: white; }
        .login-card { background: rgba(10, 10, 10, 0.9); border: 1px solid #444; padding: 25px; margin-top: 30px; }
        .stat-label { color: #888; font-size: 0.85rem; }
        .game-btn { font-weight: 800; padding: 15px; width: 100%; transition: 0.3s; }
    </style>
</head>
<body>
    <div class="dashboard-overlay">
        <div class="container-fluid p-2 p-md-4">
            <div class="login-card w-100 shadow-lg mx-auto">
                <div class="d-flex flex-column flex-md-row justify-content-between align-items-center mb-4 border-bottom border-danger pb-3">
                    <h2 class="text-white fw-bold m-0 mb-3 mb-md-0">OPERATIONAL <span class="text-danger">DASHBOARD</span></h2>
                    <button id="logoutBtn" class="btn btn-outline-danger btn-sm rounded-0 px-4 py-2">DISCONNECT</button>
                </div>
                <div id="data-container" class="row g-3 text-center">
                    <div class="col-12 col-md-4">
                        <div id="box-a" class="p-4 bg-black border border-secondary">
                            <div class="stat-label fw-bold mb-2">מרחק (A)</div>
                            <h2 id="val-a" class="display-5 text-white fw-bold m-0">-- CM</h2>
                        </div>
                    </div>
                    <div class="col-12 col-md-4">
                        <div class="p-4 bg-black border border-secondary">
                            <div class="stat-label fw-bold mb-2">תחמושת (B)</div>
                            <h2 id="val-b" class="display-5 text-white fw-bold m-0">0</h2>
                            <button id="resetShotsBtn" class="btn btn-outline-danger btn-sm mt-3 w-100">טען מחדש</button>
                        </div>
                    </div>
                    <div class="col-12 col-md-4">
                        <div class="p-4 bg-black border border-secondary">
                            <div class="stat-label fw-bold mb-2">פגיעות (C)</div>
                            <h2 id="val-c" class="display-5 text-white fw-bold m-0">0</h2>
                            <button id="resetHitsBtn" class="btn btn-outline-danger btn-sm mt-3 w-100">איפוס פגיעות</button>
                        </div>
                    </div>
                </div>
                <div class="row g-3 text-center mt-4">
                    <div class="col-12">
                        <div class="p-4 bg-black border border-secondary shadow-sm">
                            <div class="stat-label fw-bold mb-3">GAME CONTROL</div>
                            <button id="gameToggleBtn" class="btn btn-danger rounded-0 game-btn">להתחיל משחק</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        // פונקציית העזר לשליחת פקודות לשרת/FPGA
        // עליך לוודא שהיא מקושרת נכון למנגנון השליחה שלך
        async function sendCommand(address, value) {
            console.log(`Sending to ${address}: ${value}`);
            // דוגמה למבנה שליחה:
            // await fetch(`/api/write?addr=${address}&val=${value}`);
        }

        const gameToggleBtn = document.getElementById('gameToggleBtn');

        gameToggleBtn.addEventListener('click', async () => {
            // התחלת תהליך איפוס
            gameToggleBtn.disabled = true;
            gameToggleBtn.innerText = "מבצע איפוס...";
            gameToggleBtn.classList.replace('btn-danger', 'btn-secondary');

            // שליחת אות איפוס ללוח
            await sendCommand('reset_in', '000001');

            // המתנה של 600 מילי-שניות (פולס)
            setTimeout(async () => {
                // החזרת האות ל-0 כדי לאפשר משחק חדש (קריטי למחזוריות!)
                await sendCommand('reset_in', '000000');

                // שחרור הכפתור באתר
                gameToggleBtn.disabled = false;
                gameToggleBtn.innerText = "להתחיל משחק";
                gameToggleBtn.classList.replace('btn-secondary', 'btn-danger');
                
                // עדכון ויזואלי של התחמושת ל-7 מיד
                document.getElementById('val-b').innerText = "7";
                console.log("Reset completed and cycle ready.");
            }, 600);
        });

        document.getElementById('logoutBtn').addEventListener('click', () => {
            window.location.href = 'login.html';
        });
    </script>
</body>
</html>
